2B"/><circle cx="83.5" cy="98.2" r="1.75" fill="#fff"/><circle cx="119.5" cy="98.2" r="1.75" fill="#fff"/></g><ellipse cx="100" cy="112" rx="5" ry="4" fill="#B5774F" stroke="#2B2B2B" stroke-width="2" /><path d="M88 122 Q100 134 112 122" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="72" cy="118" r="6" fill="#F7A8B8" stroke="#2B2B2B" stroke-width="0" opacity=".8"/><circle cx="128" cy="118" r="6" fill="#F7A8B8" stroke="#2B2B2B" stroke-width="0" opacity=".8"/><path d="M58 74 Q60 36 100 34 Q140 36 142 74 Q124 66 100 66 Q76 66 58 74 Z" fill="#26A69A" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M96 46 H104 V52 H110 V60 H104 V66 H96 V60 H90 V52 H96 Z" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /></g></g></svg>
