8" stroke="#2B2B2B" stroke-width="0" /><path d="M62 66 L64 32 L84 50 L100 24 L116 50 L136 32 L138 66 Z" fill="#FFD54F" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="62" y="58" width="76" height="10" rx="2" fill="#F6C343" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /><circle cx="64" cy="32" r="4.5" fill="#E63B2E" stroke="#2B2B2B" stroke-width="2" /><circle cx="100" cy="24" r="4.5" fill="#4FA3E0" stroke="#2B2B2B" stroke-width="2" /><circle cx="136" cy="32" r="4.5" fill="#E63B2E" stroke="#2B2B2B" stroke-width="2" /></g></g></svg>
