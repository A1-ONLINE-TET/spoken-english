<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="zoo"><title>zoo</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><ellipse cx="100" cy="180" rx="90" ry="10" fill="#8BC34A" stroke="#2B2B2B" stroke-width="4" /><g class="sway" style="transform-box:view-box;transform-origin:100px 160px"><rect x="84" y="50" width="32" height="110" rx="12" fill="#F6C343" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" /><circle cx="96" cy="86" r="7" fill="#B8742A" stroke="#2B2B2B" stroke-width="0" /><circle cx="106" cy="110" r="8" fill="#B8742A" stroke="#2B2B2B" stroke-width="0" /><circle cx="94" cy="134" r="7" fill="#B8742A" stroke="#2B2B2B" stroke-width="0" /><circle cx="108" cy="70" r="5" fill="#B8742A" stroke="#2B2B2B" stroke-width="0" /><line x1="94" y1="30" x2="92" y2="12" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/><circle cx="92" cy="10" r="5" fill="#B8742A" stroke="#2B2B2B" stroke-width="3" /><line x1="108" y1="28" x2="112" y2="12" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/><circle cx="112" cy="10" r="5" fill="#B8742A" stroke="#2B2B2B" stroke-width="3" /><ellipse cx="82" cy="38" rx="11" ry="6" fill="#F6C343" stroke="#2B2B2B" stroke-width="4" transform="rotate(25 82 38)"/><ellipse cx="108" cy="42" rx="28" ry="17" fill="#F6C343" stroke="#2B2B2B" stroke-width="5" transform="rotate(-8 108 42)"/><ellipse cx="132" cy="48" rx="13" ry="11" fill="#E8B84A" stroke="#2B2B2B" stroke-width="4" /><circle cx="110" cy="36" r="4" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /><circle cx="134" cy="46" r="1.8" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /></g><rect x="14" y="124" width="172" height="10" rx="3" fill="#C68E5B" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /><rect x="14" y="148" width="172" height="10" rx="3" fill="#C68E5B" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /><rect x="26" y="112" width="14" height="68" rx="3" fill="#A9744A" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /><rect x="143" y="112" width="14" height="68" rx="3" fill="#A9744A" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /><rect x="72" y="112" width="14" height="68" rx="3" fill="#A9744A" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /></g></svg>
