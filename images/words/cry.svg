,2px)}50%{transform:translate(8px,-2px)}}@keyframes spd{0%{transform:translateX(0);opacity:1}100%{transform:translateX(-24px);opacity:0}}@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.25)}}@media (prefers-reduced-motion:reduce){[style*=animation]{animation:none!important}}</style><g style="animation:shk 0.6s ease-in-out infinite;transform-box:view-box;transform-origin:100px 100px"><circle cx="100" cy="100" r="62" fill="#FFD54F" stroke="#2B2B2B" stroke-width="5" /><path d="M64 76 L88 84 M136 76 L112 84" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="78" cy="98" r="7" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="3" /><circle cx="122" cy="98" r="7" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="3" /><circle cx="79" cy="100" r="3.5" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /><circle cx="121" cy="100" r="3.5" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /><path d="M76 148 Q100 128 124 148" fill="none" stroke="#2B2B2B" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /></g><g style="transform-box:view-box;transform-origin:100px 120px;animation:bob 0.9s ease-in-out infinite"><path d="M70 112 Q64 130 70 142 Q78 132 70 112 Z" fill="#4FA3E0" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M130 112 Q124 130 130 142 Q138 132 130 112 Z" fill="#4FA3E0" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g></g></svg>
