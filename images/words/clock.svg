<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="clock"><title>clock</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><rect x="52" y="168" width="24" height="10" rx="4" fill="#78909C" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" /><rect x="124" y="168" width="24" height="10" rx="4" fill="#78909C" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" /><circle cx="100" cy="100" r="70" fill="#E63B2E" stroke="#2B2B2B" stroke-width="5" /><circle cx="100" cy="100" r="56" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5" /><line x1="100.0" y1="54.0" x2="100.0" y2="48.0" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="123.0" y1="60.16283142591582" x2="126.0" y2="54.96667900320919" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="139.83716857408416" y1="77.0" x2="145.0333209967908" y2="74.0" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="146.0" y1="100.0" x2="152.0" y2="100.0" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="139.8371685740842" y1="122.99999999999999" x2="145.03332099679082" y2="125.99999999999999" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="123.0" y1="139.8371685740842" x2="126.0" y2="145.03332099679082" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="100.0" y1="146.0" x2="100.0" y2="152.0" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="77.0" y1="139.83716857408416" x2="74.0" y2="145.0333209967908" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="60.16283142591583" y1="123.00000000000003" x2="54.96667900320921" y2="126.00000000000003" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="54.0" y1="100.00000000000001" x2="48.0" y2="100.00000000000001" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="60.162831425915826" y1="77.0" x2="54.966679003209194" y2="74.0" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="76.99999999999997" y1="60.16283142591583" x2="73.99999999999997" y2="54.96667900320921" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="100" y1="100" x2="100" y2="62" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"/><g class="spinfast" style="transform-box:view-box;transform-origin:100px 100px"><line x1="100" y1="100" x2="100" y2="50" stroke="#E63B2E" stroke-width="4" stroke-linecap="round"/></g><line x1="100" y1="100" x2="124" y2="112" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /></g></svg>
