<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="zebra"><title>zebra</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><g class="bounce" style="transform-box:view-box;transform-origin:100px 176px"><ellipse cx="64" cy="54" rx="12" ry="22" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5" transform="rotate(-22 64 54)"/><ellipse cx="64" cy="56" rx="5" ry="13" fill="#333" stroke="#2B2B2B" stroke-width="0" transform="rotate(-22 64 56)"/><ellipse cx="136" cy="54" rx="12" ry="22" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5" transform="rotate(22 136 54)"/><ellipse cx="136" cy="56" rx="5" ry="13" fill="#333" stroke="#2B2B2B" stroke-width="0" transform="rotate(22 136 56)"/><polygon points="84,42 92,24 100,36 108,24 116,42 110,74 90,74" fill="#333" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /><ellipse cx="100" cy="106" rx="42" ry="58" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5" /><path d="M60 80 Q76 84 82 96 M58 104 Q74 106 80 116 M140 80 Q124 84 118 96 M142 104 Q126 106 120 116" fill="none" stroke="#2B2B2B" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><path d="M100 76 L100 94" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="100" cy="146" rx="30" ry="24" fill="#5F6B73" stroke="#2B2B2B" stroke-width="5" /><ellipse cx="90" cy="146" rx="4" ry="6" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /><ellipse cx="110" cy="146" rx="4" ry="6" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /><g class="c blink" ><circle cx="82" cy="102" r="5" fill="#2B2B2B"/><circle cx="118" cy="102" r="5" fill="#2B2B2B"/><circle cx="83.5" cy="100.2" r="1.75" fill="#fff"/><circle cx="119.5" cy="100.2" r="1.75" fill="#fff"/></g></g></g></svg>
