<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="boxer"><title>boxer</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><ellipse cx="100" cy="178" rx="52" ry="7" fill="#000" opacity="0.10"/><g class="bounce" style="transform-box:view-box;transform-origin:100px 176px"><circle cx="100" cy="56" r="24" fill="#E7B48C" stroke="#2B2B2B" stroke-width="5" /><path d="M76 44 Q100 26 124 44 Q124 32 100 30 Q76 32 76 44 Z" fill="#3A2A1A" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><g class="c blink" ><circle cx="90" cy="56" r="4" fill="#2B2B2B"/><circle cx="110" cy="56" r="4" fill="#2B2B2B"/><circle cx="91.5" cy="54.2" r="1.4" fill="#fff"/><circle cx="111.5" cy="54.2" r="1.4" fill="#fff"/></g><path d="M92 66 Q100 70 108 66" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M58 150 Q58 100 100 96 Q142 100 142 150 Z" fill="#E53935" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="52" cy="118" r="18" fill="none" stroke="#2B2B2B" stroke-width="10"/><circle cx="52" cy="118" r="18" fill="none" stroke="#C62828" stroke-width="6"/><circle cx="52" cy="118" r="18" fill="#E53935" stroke="#2B2B2B" stroke-width="5" /><circle cx="44" cy="112" r="5" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="0" opacity=".4"/><circle cx="148" cy="118" r="18" fill="none" stroke="#2B2B2B" stroke-width="10"/><circle cx="148" cy="118" r="18" fill="none" stroke="#C62828" stroke-width="6"/><circle cx="148" cy="118" r="18" fill="#E53935" stroke="#2B2B2B" stroke-width="5" /><circle cx="140" cy="112" r="5" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="0" opacity=".4"/></g></g></svg>
