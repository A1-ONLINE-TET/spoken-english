<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="watch"><title>watch</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><g class="wiggle" style="transform-box:view-box;transform-origin:100px 100px"><path d="M80 18 L120 18 L116 62 L84 62 Z" fill="#8D5A33" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M84 138 L116 138 L120 182 L80 182 Z" fill="#8D5A33" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="100" cy="170" r="2" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /><circle cx="100" cy="166" r="2.5" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /><circle cx="100" cy="36" r="2.5" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /><rect x="146" y="94" width="12" height="12" rx="2" fill="#F6C343" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" /><circle cx="100" cy="100" r="50" fill="#CFD8DC" stroke="#2B2B2B" stroke-width="5" /><circle cx="100" cy="100" r="40" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5" /><line x1="131.0" y1="100.0" x2="136.0" y2="100.0" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="126.8" y1="115.5" x2="131.2" y2="118.0" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="115.5" y1="126.8" x2="118.0" y2="131.2" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="100.0" y1="131.0" x2="100.0" y2="136.0" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="84.5" y1="126.8" x2="82.0" y2="131.2" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="73.2" y1="115.5" x2="68.8" y2="118.0" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="69.0" y1="100.0" x2="64.0" y2="100.0" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="73.2" y1="84.5" x2="68.8" y2="82.0" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="84.5" y1="73.2" x2="82.0" y2="68.8" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="100.0" y1="69.0" x2="100.0" y2="64.0" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="115.5" y1="73.2" x2="118.0" y2="68.8" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="126.8" y1="84.5" x2="131.2" y2="82.0" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="100" y1="100" x2="100" y2="76" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/><g class="spin" style="transform-box:view-box;transform-origin:100px 100px"><line x1="100" y1="100" x2="100" y2="70" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/></g><circle cx="100" cy="100" r="4" fill="#E63B2E" stroke="#2B2B2B" stroke-width="2" /></g></g></svg>
