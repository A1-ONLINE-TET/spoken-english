<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="moon"><title>moon</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><g class="float" style="transform-box:view-box;transform-origin:100px 176px"><path d="M122 28 C72 32 38 78 50 126 C62 170 126 184 166 146 C118 152 90 110 122 28 Z" fill="#FFD54F" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M62 108 Q70 100 78 108" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="70" cy="128" r="6" fill="#F7A8B8" stroke="#2B2B2B" stroke-width="0" /><path d="M64 138 Q74 146 84 138" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><g class="pulse" style="transform-box:view-box;transform-origin:152px 46px"><polygon points="152.0,32.0 155.5,41.1 165.3,41.7 157.7,47.9 160.2,57.3 152.0,52.0 143.8,57.3 146.3,47.9 138.7,41.7 148.5,41.1" fill="#FFD54F" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" /></g><g class="pulse" style="transform-box:view-box;transform-origin:176px 104px"><polygon points="176.0,94.0 178.4,100.8 185.5,100.9 179.8,105.2 181.9,112.1 176.0,108.0 170.1,112.1 172.2,105.2 166.5,100.9 173.6,100.8" fill="#FFD54F" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" /></g><g class="pulse" style="transform-box:view-box;transform-origin:138px 168px"><polygon points="138.0,159.0 140.4,164.8 146.6,165.2 141.8,169.2 143.3,175.3 138.0,172.0 132.7,175.3 134.2,169.2 129.4,165.2 135.6,164.8" fill="#FFD54F" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" /></g></g></g></svg>
