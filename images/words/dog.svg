"5" /><ellipse cx="100" cy="104" rx="21" ry="16" fill="#FFF3D6" stroke="#2B2B2B" stroke-width="5" /><ellipse cx="100" cy="96" rx="9" ry="6" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="2" /><path d="M100 102 L100 110 M100 110 Q92 118 84 111 M100 110 Q108 118 116 111" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M94 114 Q100 132 106 114 Z" fill="#F7A8B8" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"/><g class="c blink" ><circle cx="85" cy="78" r="5" fill="#2B2B2B"/><circle cx="115" cy="78" r="5" fill="#2B2B2B"/><circle cx="86.5" cy="76.2" r="1.75" fill="#fff"/><circle cx="116.5" cy="76.2" r="1.75" fill="#fff"/></g></g></g></svg>
