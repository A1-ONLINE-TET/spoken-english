<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="goat"><title>goat</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><ellipse cx="100" cy="178" rx="52" ry="7" fill="#000" opacity="0.10"/><g class="bounce" style="transform-box:view-box;transform-origin:100px 176px"><g class="wag" style="transform-box:view-box;transform-origin:158px 104px"><polygon points="158,102 176,90 166,114" fill="#F1ECE0" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /></g><rect x="80" y="130" width="9" height="42" rx="3" fill="#F1ECE0" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /><rect x="96" y="130" width="9" height="42" rx="3" fill="#F1ECE0" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /><rect x="126" y="130" width="9" height="42" rx="3" fill="#F1ECE0" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /><rect x="142" y="130" width="9" height="42" rx="3" fill="#F1ECE0" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /><rect x="80" y="166" width="9" height="8" rx="2" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="2" stroke-linejoin="round" /><rect x="96" y="166" width="9" height="8" rx="2" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="2" stroke-linejoin="round" /><rect x="126" y="166" width="9" height="8" rx="2" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="2" stroke-linejoin="round" /><rect x="142" y="166" width="9" height="8" rx="2" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="2" stroke-linejoin="round" /><path d="M66 108 C56 90 54 72 62 54 L92 58 C96 78 104 96 110 112 Z" fill="#F1ECE0" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="114" cy="112" rx="50" ry="30" fill="#F1ECE0" stroke="#2B2B2B" stroke-width="5" /><ellipse cx="62" cy="50" rx="28" ry="20" fill="#F1ECE0" stroke="#2B2B2B" stroke-width="5" transform="rotate(-14 62 50)"/><ellipse cx="40" cy="58" rx="13" ry="11" fill="#E4D9C4" stroke="#2B2B2B" stroke-width="4" /><path d="M64 34 Q60 10 84 6" fill="none" stroke="#2B2B2B" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" /><path d="M64 34 Q60 10 84 6" fill="none" stroke="#B59A6B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M76 36 Q78 14 98 14" fill="none" stroke="#2B2B2B" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" /><path d="M76 36 Q78 14 98 14" fill="none" stroke="#B59A6B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><polygon points="38,68 44,92 54,70" fill="#F1ECE0" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /><ellipse cx="86" cy="52" rx="12" ry="6" fill="#F1ECE0" stroke="#2B2B2B" stroke-width="3" transform="rotate(35 86 52)"/><circle cx="60" cy="46" r="4" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /><circle cx="35" cy="56" r="2" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /></g></g></svg>
