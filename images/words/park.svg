<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="park"><title>park</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><g class="bounce" style="transform-box:view-box;transform-origin:100px 176px"><rect x="20" y="164" width="160" height="14" rx="7" fill="#81C784" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" /><rect x="88" y="100" width="14" height="68" rx="4" fill="#8D5A33" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" /><circle cx="95" cy="80" r="36" fill="#43A047" stroke="#2B2B2B" stroke-width="5" /><circle cx="74" cy="100" r="24" fill="#66BB6A" stroke="#2B2B2B" stroke-width="5" /><circle cx="120" cy="100" r="26" fill="#66BB6A" stroke="#2B2B2B" stroke-width="5" /><rect x="116" y="150" width="60" height="8" rx="3" fill="#B5793F" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" /><line x1="120" y1="158" x2="120" y2="172" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="172" y1="158" x2="172" y2="172" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><line x1="118" y1="136" x2="176" y2="136" stroke="#B5793F" stroke-width="5" stroke-linecap="round"/><path d="M36 132 L36 172 M72 132 L72 172 M36 132 L72 132" fill="none" stroke="#E53935" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M44 132 L44 150 M64 132 L64 150" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="40" y="150" width="28" height="6" rx="2" fill="#FFB300" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" /></g></g></svg>
