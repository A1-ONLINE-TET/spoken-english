138,72 124,74" fill="#8D5A33" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" /><path d="M64 148 L110 168 L96 150" fill="none" stroke="#2B2B2B" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" /><path d="M64 148 L110 168 L96 150" fill="none" stroke="#B06A3A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><rect x="86" y="150" width="12" height="24" rx="4" fill="#8D5A33" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" /></g></g></svg>
