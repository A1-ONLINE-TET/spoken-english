<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="ring"><title>ring</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><ellipse cx="100" cy="178" rx="52" ry="7" fill="#000" opacity="0.10"/><g class="wiggle" style="transform-box:view-box;transform-origin:100px 160px"><path d="M56 116 A44 44 0 1 0 144 116 A44 44 0 1 0 56 116 Z M68 116 A32 32 0 1 1 132 116 A32 32 0 1 1 68 116 Z" fill="#F6C343" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill-rule="evenodd"/><polygon points="84,40 116,40 130,56 100,84 70,56" fill="#CFEAFB" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" /><line x1="70" y1="56" x2="130" y2="56" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="84" y1="40" x2="92" y2="56" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="116" y1="40" x2="108" y2="56" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="92" y1="56" x2="100" y2="84" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><line x1="108" y1="56" x2="100" y2="84" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/><g class="pulse" style="transform-box:view-box;transform-origin:148px 32px"><polygon points="148.0,18.0 151.5,28.5 162.0,32.0 151.5,35.5 148.0,46.0 144.5,35.5 134.0,32.0 144.5,28.5" fill="#FFD54F" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" /></g><g class="pulse" style="transform-box:view-box;transform-origin:52px 44px"><polygon points="52.0,34.0 54.8,41.2 62.0,44.0 54.8,46.8 52.0,54.0 49.2,46.8 42.0,44.0 49.2,41.2" fill="#FFD54F" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" /></g></g></g></svg>
