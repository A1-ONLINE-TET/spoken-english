<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="run"><title>run</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><style>@keyframes swA{0%,100%{transform:rotate(-32deg)}50%{transform:rotate(32deg)}}@keyframes swB{0%,100%{transform:rotate(32deg)}50%{transform:rotate(-32deg)}}@keyframes swa{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}@keyframes swb{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes jmp{0%,100%{transform:translateY(8px)}28%{transform:translateY(10px)}60%{transform:translateY(-18px)}}@keyframes toM{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-54deg)}}@keyframes stir{to{transform:rotate(360deg)}}@keyframes rub{0%,100%{transform:translate(-6px,0)}50%{transform:translate(6px,0)}}@keyframes rubB{0%,100%{transform:translate(6px,0)}50%{transform:translate(-6px,0)}}@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.06)}}@keyframes shk{0%,100%{transform:translateX(-3px) rotate(-3deg)}50%{transform:translateX(3px) rotate(3deg)}}@keyframes sway2{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes wave{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(20deg)}}@keyframes writem{0%,100%{transform:translate(-6px,2px)}50%{transform:translate(8px,-2px)}}@keyframes spd{0%{transform:translateX(0);opacity:1}100%{transform:translateX(-24px);opacity:0}}@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.25)}}@media (prefers-reduced-motion:reduce){[style*=animation]{animation:none!important}}</style><ellipse cx="100" cy="178" rx="52" ry="7" fill="#000" opacity="0.10"/><g style="animation:spd .6s linear infinite;animation-delay:0s"><line x1="40" y1="60" x2="18" y2="60" stroke="#90A4AE" stroke-width="4" stroke-linecap="round"/></g><g style="animation:spd .6s linear infinite;animation-delay:0.2s"><line x1="30" y1="90" x2="8" y2="90" stroke="#90A4AE" stroke-width="4" stroke-linecap="round"/></g><g style="animation:spd .6s linear infinite;animation-delay:0.4s"><line x1="44" y1="120" x2="22" y2="120" stroke="#90A4AE" stroke-width="4" stroke-linecap="round"/></g><g style="transform-box:view-box;transform-origin:94px 108px;animation:swB 0.6s ease-in-out infinite"><path d="M94 108 L94 158" fill="none" stroke="#2B2B2B" stroke-width="21" stroke-linejoin="round" stroke-linecap="round" /><path d="M94 108 L94 158" fill="none" stroke="#455A64" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" /><rect x="82" y="154" width="24" height="10" rx="4" fill="#E53935" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" /></g><g style="transform-box:view-box;transform-origin:102px 68px;animation:swA 0.6s ease-in-out infinite"><path d="M102 68 L102 104" fill="none" stroke="#2B2B2B" stroke-width="19" stroke-linejoin="round" stroke-linecap="round" /><path d="M102 68 L102 104" fill="none" stroke="#4FA3E0" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" /><circle cx="102" cy="106" r="6" fill="#C98F63" stroke="#2B2B2B" stroke-width="3" /></g><g style="animation:bob .3s ease-in-out infinite"><path d="M104 62 L94 108" fill="none" stroke="#2B2B2B" stroke-width="36" stroke-linejoin="round" stroke-linecap="round" /><path d="M104 62 L94 108" fill="none" stroke="#4