<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="flower"><title>flower</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><ellipse cx="100" cy="178" rx="52" ry="7" fill="#000" opacity="0.10"/><g class="sway" style="transform-box:view-box;transform-origin:100px 176px"><path d="M100 100 L100 174" fill="none" stroke="#2B2B2B" stroke-width="15" stroke-linejoin="round" stroke-linecap="round" /><path d="M100 100 L100 174" fill="none" stroke="#43A047" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><path d="M100 150 Q132 130 146 150 Q124 164 100 158 Z" fill="#66BB6A" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="128.0" cy="66.0" rx="16" ry="22" fill="#F06292" stroke="#2B2B2B" stroke-width="4" transform="rotate(90 128.0 66.0)"/><ellipse cx="114.0" cy="90.24871130596428" rx="16" ry="22" fill="#F06292" stroke="#2B2B2B" stroke-width="4" transform="rotate(150 114.0 90.24871130596428)"/><ellipse cx="86.0" cy="90.24871130596429" rx="16" ry="22" fill="#F06292" stroke="#2B2B2B" stroke-width="4" transform="rotate(210 86.0 90.24871130596429)"/><ellipse cx="72.0" cy="66.0" rx="16" ry="22" fill="#F06292" stroke="#2B2B2B" stroke-width="4" transform="rotate(270 72.0 66.0)"/><ellipse cx="85.99999999999999" cy="41.75128869403572" rx="16" ry="22" fill="#F06292" stroke="#2B2B2B" stroke-width="4" transform="rotate(330 85.99999999999999 41.75128869403572)"/><ellipse cx="114.0" cy="41.75128869403572" rx="16" ry="22" fill="#F06292" stroke="#2B2B2B" stroke-width="4" transform="rotate(390 114.0 41.75128869403572)"/><circle cx="100" cy="66" r="15" fill="#FFD54F" stroke="#2B2B2B" stroke-width="5" /></g></g></svg>
