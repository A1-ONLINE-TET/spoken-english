121.7,141.7 120.0,146.0 118.3,141.7 114.0,140.0 118.3,138.3" fill="#FFF59D" stroke="#2B2B2B" stroke-width="2" stroke-linejoin="round" /></g><g class="pulse" style="transform-box:view-box;transform-origin:150px 150px"><polygon points="150.0,143.0 152.0,148.0 157.0,150.0 152.0,152.0 150.0,157.0 148.0,152.0 143.0,150.0 148.0,148.0" fill="#FFF59D" stroke="#2B2B2B" stroke-width="2" stroke-linejoin="round" /></g></g></svg>
