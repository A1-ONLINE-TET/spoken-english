,2px)}50%{transform:translate(8px,-2px)}}@keyframes spd{0%{transform:translateX(0);opacity:1}100%{transform:translateX(-24px);opacity:0}}@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.25)}}@media (prefers-reduced-motion:reduce){[style*=animation]{animation:none!important}}</style><g style="animation:shk 0.5s ease-in-out infinite;transform-box:view-box;transform-origin:100px 100px"><circle cx="100" cy="100" r="62" fill="#FFD54F" stroke="#2B2B2B" stroke-width="5" /><path d="M70 84 Q80 70 90 84 M110 84 Q120 70 130 84" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M58 112 Q100 112 142 112 Q136 160 100 160 Q64 160 58 112 Z" fill="#B71C1C" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M62 114 L138 114 Q136 124 132 126 L68 126 Q64 124 62 114 Z" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="100" cy="148" rx="18" ry="8" fill="#F48FB1" stroke="#2B2B2B" stroke-width="0" /></g></g></svg>
