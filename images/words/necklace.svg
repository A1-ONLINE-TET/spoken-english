<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="necklace"><title>necklace</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><ellipse cx="100" cy="178" rx="52" ry="7" fill="#000" opacity="0.10"/><g class="bounce" style="transform-box:view-box;transform-origin:100px 160px"><path d="M50 50 Q100 120 150 50" fill="none" stroke="#FFD54F" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><circle cx="60" cy="60.81559480312316" r="4" fill="#FFD54F" stroke="#2B2B2B" stroke-width="2" /><circle cx="70" cy="75.7156047877957" r="4" fill="#FFD54F" stroke="#2B2B2B" stroke-width="2" /><circle cx="80" cy="92.47339220468474" r="4" fill="#FFD54F" stroke="#2B2B2B" stroke-width="2" /><circle cx="90" cy="108.25221162307815" r="4" fill="#FFD54F" stroke="#2B2B2B" stroke-width="2" /><circle cx="100" cy="120.0" r="4" fill="#FFD54F" stroke="#2B2B2B" stroke-width="2" /><circle cx="110" cy="108.25221162307815" r="4" fill="#FFD54F" stroke="#2B2B2B" stroke-width="2" /><circle cx="120" cy="92.47339220468474" r="4" fill="#FFD54F" stroke="#2B2B2B" stroke-width="2" /><circle cx="130" cy="75.71560478779571" r="4" fill="#FFD54F" stroke="#2B2B2B" stroke-width="2" /><circle cx="140" cy="60.81559480312316" r="4" fill="#FFD54F" stroke="#2B2B2B" stroke-width="2" /><path d="M100 118 L100 134" fill="none" stroke="#FFD54F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><polygon points="100,134 90,156 110,156" fill="#E53935" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round" /><circle cx="100" cy="150" r="5" fill="#4FA3E0" stroke="#2B2B2B" stroke-width="2" /></g></g></svg>
