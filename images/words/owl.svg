<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="owl"><title>owl</title><style>
.a{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:50% 50%}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.float{animation:float 2.4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin{animation:spin 6s linear infinite}
.spinfast{animation:spin 1s linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite}
.wag{animation:wag .7s ease-in-out infinite}
.blink{animation:blink 3.4s infinite}
.swim{animation:swim 2.4s ease-in-out infinite}
.fall{animation:fall 1.4s linear infinite}
.updown{animation:updown 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes swim{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes updown{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".7" specularExponent="22" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="50"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.15" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter></defs><g filter="url(#sh)"><g class="bounce" style="transform-box:view-box;transform-origin:100px 176px"><rect x="36" y="164" width="128" height="12" rx="6" fill="#8D5A33" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /><line x1="86" y1="150" x2="86" y2="166" stroke="#F4A340" stroke-width="5" stroke-linecap="round"/><line x1="114" y1="150" x2="114" y2="166" stroke="#F4A340" stroke-width="5" stroke-linecap="round"/><polygon points="62,70 64,42 88,60" fill="#8D6E63" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" /><polygon points="138,70 136,42 112,60" fill="#8D6E63" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" /><ellipse cx="100" cy="112" rx="48" ry="56" fill="#8D6E63" stroke="#2B2B2B" stroke-width="5" /><ellipse cx="100" cy="134" rx="30" ry="32" fill="#D7CCC8" stroke="#2B2B2B" stroke-width="0" /><path d="M86 128 Q91 134 96 128" fill="none" stroke="#A1887F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M100 128 Q105 134 110 128" fill="none" stroke="#A1887F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M90 128 Q95 134 100 128" fill="none" stroke="#A1887F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M104 128 Q109 134 114 128" fill="none" stroke="#A1887F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M54 108 Q40 140 62 162 Q70 132 62 110 Z" fill="#6D4C41" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M146 108 Q160 140 138 162 Q130 132 138 110 Z" fill="#6D4C41" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="78" cy="92" r="20" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5" /><circle cx="122" cy="92" r="20" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5" /><g class="blink" style="transform-box:view-box;transform-origin:100px 93px"><circle cx="80" cy="93" r="9" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /><circle cx="120" cy="93" r="9" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="0" /><circle cx="83" cy="90" r="3" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="0" /><circle cx="123" cy="90" r="3" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="0" /></g><polygon points="93,106 107,106 100,122" fill="#F4A340" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round" /></g></g></svg>
